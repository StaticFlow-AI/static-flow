name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight gate: figure out which crates the change affects. Pure
  # stdlib (tomllib + git diff) -- no cargo, no submodules, no compilation --
  # so clippy/test below are skipped entirely when no crate code changed.
  changes:
    name: detect affected crates
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      test_crates: ${{ steps.detect.outputs.test_crates }}
      clippy_crates: ${{ steps.detect.outputs.clippy_crates }}
      disk_heavy: ${{ steps.detect.outputs.disk_heavy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected crates
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_affected.py detect

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.mode != 'none'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize public build submodules
        run: scripts/init_public_build_submodules.sh

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel="$(scripts/ci_rust_toolchain_channel.sh)"
          echo "Pinned Rust toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy for affected crates
        # subset -> clippy only the changed crates; all -> the curated
        # host + wasm set. See scripts/ci_affected.py.
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.clippy_crates }}
        run: python3 scripts/ci_affected.py run-clippy

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.mode != 'none'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize public build submodules
        run: scripts/init_public_build_submodules.sh

      - name: Free runner disk space (vendored-heavy builds)
        # Building the vendored lance/lancedb + datafusion trees from a
        # cold cache has exhausted the ~14 GB the stock ubuntu runner
        # leaves free. The gate marks disk_heavy when the test set pulls
        # in any vendored deps/ tree (full workspace, or a subset that
        # reaches static-flow-shared / sf-cli on the host target). Hosted
        # runners are throwaway VMs, so dropping the preinstalled SDKs we
        # never use (.NET, Android, Haskell, CodeQL, docker images)
        # reclaims 25+ GB. Light subset runs skip this to save the ~2 min.
        if: needs.changes.outputs.disk_heavy == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        run: |
          channel="$(scripts/ci_rust_toolchain_channel.sh)"
          echo "Pinned Rust toolchain: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run tests for affected crates
        # subset -> test the changed crates + their dependents; all -> the
        # full workspace. See scripts/ci_affected.py.
        env:
          MODE: ${{ needs.changes.outputs.mode }}
          CRATES: ${{ needs.changes.outputs.test_crates }}
        run: python3 scripts/ci_affected.py run-test
